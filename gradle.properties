# 不要在这里加 -Dfile.encoding=UTF-8：Java 17 下守护进程会以 UTF-8 写
# worker 的 @argfile，而 JVM 启动器按系统 GBK 读取，中文路径会整体乱码，
# 导致 testDebugUnitTest 全部 ClassNotFoundException。
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# The shared workspace path contains Chinese characters; AGP's Windows path check
# is conservative and would reject this otherwise valid local project.
android.overridePathCheck=true
